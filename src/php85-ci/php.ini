; Settings tuned for CI: fail loudly, never fail on memory.
memory_limit = -1
date.timezone = UTC

error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /dev/stderr

; pcov is the coverage driver; it stays off until a test runner enables it.
pcov.enabled = 0
pcov.directory = /app
