name: build-php

on:
  push:
    branches:
      - "master"

  schedule:
    - cron: "0 0 * * 0"

jobs:
  build-php-images:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [85, 84, 83, 82, 81]

    name: Build PHP ${{ matrix.php }}

    steps:
      - name: Check Out Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./src/php${{ matrix.php }}
          file: ./src/php${{ matrix.php }}/Dockerfile
          push: true
          tags: robmellett/php-${{ matrix.php }}:latest,${{ steps.meta.outputs.tags }}
          build-args: |
            WWWGROUP=1000
            WWWUSER=1000
