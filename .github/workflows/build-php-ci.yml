name: build-php-ci

on:
  push:
    branches:
      - "master"

  schedule:
    - cron: "0 0 * * 0"

jobs:
  build-php-ci-images:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [85, 84]

    name: Build PHP ${{ matrix.php }} CI

    steps:
      - name: Check Out Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./src/php${{ matrix.php }}-ci
          file: ./src/php${{ matrix.php }}-ci/Dockerfile
          push: true
          tags: robmellett/php-${{ matrix.php }}-ci:latest
